<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<style>
		.cta-button{
			padding: 0 1.3rem;
			height: 2.8rem;
			border-radius: 100px;
			background: var(--color);
			border:none;
			color : #fff;
			font-family: "base";
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			cursor: pointer;

			> .button-content{
				height: 1.5rem;
				width: fit-content;
				display: flex;
				align-items: center;
				justify-content: center;
				line-height: 1;
			}
			> .arrow{
				height: 1.5rem;
				width: 1.5rem;
				display: flex;
				align-items: center;
				justify-content: center;
			} 
			> .arrow svg{
				height: 1.2rem;
				width: 1.2rem;
				display: block;
				transform: rotate(-45deg);
				will-change: transform;
				transition: 0.2s;
			}

			&:hover .arrow svg{
				transform: rotate(0deg);
			}
		}
	</style>
</head>
<body>
<button class="cta-button">
	<span class="button-content">Button Name</span>
	<span class="arrow"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span>
</button>
</body>
</html>
