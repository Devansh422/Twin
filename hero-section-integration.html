<!-- 
    WORDPRESS HERO SECTION INTEGRATION SNIPPET
    
    INSTRUCTIONS:
    1. Go to Elementor -> Custom Code.
    2. Add New -> Title: "Hero Section Script".
    3. Location: "Body End".
    4. Priority: 1.
    5. Paste this code.
    6. VITAL: Update the URLs in the "CONFIG" section below to match your WordPress Media Library.
    7. In Elementor Editor:
       - Create a Container/Section.
       - Set Content Width: Full Width.
       - Set Column Gap: No Gap.
       - Set Height: Fit to Screen (100vh).
       - Give it the CSS ID: hero-section-container
-->

<!-- Dependencies -->
<!-- GSAP (Optional: Only if you want simple fade-ins, otherwise can be removed) -->
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

<script>
    // ============================================
    // CONFIGURATION: UPDATE THESE URLS
    // ============================================
    const HERO_ASSETS = {
        // Video URL (Upload .mp4 to Media Library)
        heroVideo: 'https://twinindia.com/wp-content/uploads/2026/01/hero-video.mp4', 
        
        // Font URLs (Upload .woff2 files to Media Library)
        fontRegular: 'https://twinindia.com/wp-content/uploads/2026/01/VastagoGrotesk-Regular.woff2',
        fontHeading: 'https://twinindia.com/wp-content/uploads/2026/01/VastagoGrotesk-SemiBold.woff2',

        // Links
        enquireLink: '#contact'
    };

    document.addEventListener("DOMContentLoaded", initHeroSection);
    
    // Fallback
    if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(initHeroSection, 100);
    }

    function initHeroSection() {
        const container = document.querySelector('#hero-section-container');
        if (!container) return; // Exit if container not found

        // Prevent double initialization
        if (container.dataset.heroInitialized) return;
        container.dataset.heroInitialized = "true";

        // 1. Inject CSS
        const style = document.createElement('style');
        style.textContent = `
            @font-face {
                font-family: 'HeroBase';
                src: url('\${HERO_ASSETS.fontRegular}') format('woff2');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: 'HeroHeading';
                src: url('\${HERO_ASSETS.fontHeading}') format('woff2');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }

            :root {
                --color: #ED1D21;
            }

            #hero-section-container {
                position: relative;
                width: 100%;
                height: 100vh; /* Ensure full height */
                overflow: hidden;
                margin: 0;
                padding: 0;
            }

            /* Video Background */
            #heroVideo {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: 0; 
            }

            /* Overlay to make text readable */
            .hero-overlay {
                position: absolute;
                top: 0; 
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.2); 
                z-index: 1;
            }

            /* Content Styling */
            .hero-content {
                position: relative;
                z-index: 2;
                height: 100%;
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: flex-end; /* Align to bottom-ish */
                align-items: flex-start;
                padding: 2rem 2rem 4rem 4rem; 
                box-sizing: border-box;
                gap: 1.5rem;
            }

            .hero-content h1 {
                font-family: 'HeroHeading', sans-serif;
                font-size: clamp(2.5rem, 5vw, 4.5rem); 
                line-height: 1.1;
                color: #fff;
                margin: 0;
                max-width: 800px;
                text-transform: none; 
            }

            .hero-content .sub-text {
                font-family: 'HeroBase', sans-serif;
                font-size: clamp(1rem, 2vw, 1.35rem);
                color: #fff;
                max-width: 600px;
                line-height: 1.5;
                opacity: 0.9;
            }

            .hero-content .cta-button {
                margin-top: 1rem;
            }

            .hero-content .cta-button button {
                border: 2px solid var(--color);
                border-radius: 100px;
                height: 3.5rem;
                padding: 0 3rem;
                font-size: 1.1rem;
                font-family: 'HeroHeading', sans-serif;
                background: var(--color);
                color: #fff;
                cursor: pointer;
                transition: all 0.3s ease;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .hero-content .cta-button button:hover {
                background: #fff;
                color: var(--color);
                border-color: #fff;
            }

            /* Mobile Responsiveness */
            @media (max-width: 768px) {
                .hero-content {
                    padding: 2rem;
                    justify-content: center;
                }
                .hero-content h1 {
                    width: 100%;
                }
                .hero-content .sub-text {
                    width: 100%;
                }
            }
        `;
        document.head.appendChild(style);

        // 2. Inject HTML
        // Note: playsinline matches mobile play requirements
        container.innerHTML = `
            <video id="heroVideo" autoplay muted loop playsinline>
                <source src="${HERO_ASSETS.heroVideo}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1>Manufacturing at Scale.<br>Quality Without Compromise</h1>
                <span class="sub-text">From precison-driven production to global supply, we maufacture products brand trust efficiently, reliably, responsibly</span>
                <div class="cta-button">
                    <button onclick="window.location.href='${HERO_ASSETS.enquireLink}'">Enquire Now</button>
                </div>
            </div>
        `;
        
        // Animations removed per request
    }
</script>
