<!-- 
    ABOUT SECTION INTEGRATION SNIPPET
    
    INSTRUCTIONS:
    1. Go to Elementor -> Custom Code.
    2. Add New -> Title: "About Section Script".
    3. Location: "Body End".
    4. Priority: 1.
    5. Paste this code.
    6. VITAL: Update the URLs in the "CONFIG" section below to match your WordPress Media Library.
    7. In Elementor Editor:
       - Create a Container/Section.
       - Set Content Width: Full Width.
       - Set Column Gap: No Gap.
       - Give it the CSS ID: about
-->

<!-- Dependencies -->
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>

<script>
    // ============================================
    // CONFIGURATION: UPDATE THESE URLS
    // ============================================
    const ABOUT_ASSETS = {
        // Font URLs (Upload .woff2 files to Media Library)
        fontRegular: 'https://twinindia.com/wp-content/uploads/2026/01/VastagoGrotesk-Regular.woff2',
        fontHeading: 'https://twinindia.com/wp-content/uploads/2026/01/VastagoGrotesk-SemiBold.woff2',
        
        // Image URL (Upload to Media Library)
        aboutImage: 'https://twinindia.com/wp-content/uploads/2026/01/about-us-image.jpg', 
    };

    document.addEventListener("DOMContentLoaded", initAboutSection);
    
    // Fallback
    if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(initAboutSection, 100);
    }

    function initAboutSection() {
        const container = document.querySelector('#about');
        if (!container) return; // Exit if container not found

        // Prevent double initialization
        if (container.dataset.aboutInitialized) return;
        container.dataset.aboutInitialized = "true";

        // 1. Inject CSS
        const style = document.createElement('style');
        style.textContent = `
            @font-face {
                font-family: 'AboutBase';
                src: url('\${ABOUT_ASSETS.fontRegular}') format('woff2');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: 'AboutHeading';
                src: url('\${ABOUT_ASSETS.fontHeading}') format('woff2');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }

            :root {
                --color: #ED1D21;
            }

            #about {
                width: 100%;
                overflow: hidden;
                margin: 0;
                padding: 0;
            }

            .about-wrapper {
                padding: 5rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                font-family: 'AboutBase', sans-serif;
            }

            .about-wrapper h2 {
                color: #000;
                font-family: 'AboutHeading', sans-serif;
                font-weight: normal;
                margin-bottom: 1rem;
                font-size: 1.5rem; /* Approximate default h2 size if not specified */
            }

            .about-container {
                display: flex;
                gap: 1rem;
            }

            .about-container .about-image {
                width: 40%;
                height: auto;
                object-fit: cover;
                border-radius: 20px;
            }
            
            .about-container .about-details {
                width: 60%; /* Adjusted to share space with image */
                height: 100%;
                font-size: 1.2rem;
                line-height: 1.5;
                font-family: 'AboutBase', sans-serif;
            }

            /* Animation specific styles */
            .char-wrap {
               display: inline-block;
               overflow: hidden;
               vertical-align: top;
            }

            /* Responsive */
            @media (max-width: 1000px){
                .about-wrapper .about-container .about-text{
                    font-size: 1.4rem;image{
                    width: 50%;
                }
            }

            @media (max-width: 500px){
                .about-wrapper {
                    padding: 2rem;
                }
                .about-container {
                    flex-direction: column;
                }
                .about-container .about-image {
                    width: 100%;
                    margin-bottom: 1rem
                .about-container .about-details {
                    font-size: 1rem;
                    width: 100%;
                }
            }
        `;
        document.head.appendChild(style);

        // 2. Inject HTML
        const content = `
            <div class="about-wrapper">
                <h2>About Us</h2>
                <div><img src="${ABOUT_ASSETS.aboutImage}" class="about-image" alt="About Twin Tech"></div>
                    <div class="about-details">Twin Tech India Pvt. Ltd is a premier manufacturer and supplier of aerosols, sprays, and specialty machines for various industries. Our flagship brand, SPRAYZET, offers custom-designed, biodegradable aerosols for applications in agriculture, engineering, textiles, food manufacturing, and more. We also provide contract aerosol packaging with private label capabilities, ensuring quality and efficiency.<br><br>Our diverse product line includes industrial maintenance aerosols, self-adhesive tapes, home care products under "Hacker," air deodorizers under "Twinzy," and car care solutions under "Evershine." We are committed to high standards, innovation, and timely delivery.</div>
            </div>
        `;
        
        container.innerHTML = content;

        // 3. Initialize Animations
        initAboutAnimations(container);
    }

    function initAboutAnimations(container) {
        if (typeof gsap === 'undefined' || typeof Splitting === 'undefined' || typeof ScrollTrigger === 'undefined') {
            console.warn('GSAP or Splitting not loaded yet.');
            return;
        }

        gsap.registerPlugin(ScrollTrigger);

        const targets = container.querySelectorAll('.animate-text-about');
        
        // Helper to wrap characters
        const wrapElements = (elems, wrapType, wrapClass) => {
            elems.forEach(char => {
                if (char.parentElement && char.parentElement.classList.contains(wrapClass)) return;
                const wrapEl = document.createElement(wrapType);
                wrapEl.classList = wrapClass;
                char.parentNode.appendChild(wrapEl);
                wrapEl.appendChild(char);
            });
        };

        targets.forEach(el => {
            // Apply Splitting
            Splitting({ target: el, by: 'chars' });

            const allChars = el.querySelectorAll('.char');
            if (!allChars.length) return;

            // Wrap for masking effect if needed, or just animate
            wrapElements(allChars, 'span', 'char-wrap');

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: el,
                    start: 'top bottom-=10%', // trigger when top of element hits bottom off screen (adjusted)
                    end: 'top center',
                    toggleActions: 'play none none reverse'
                }
            });

            tl.fromTo(allChars,
                {
                    willChange: 'transform',
                    transformOrigin: '0% 50%',
                    yPercent: 105,
                    opacity: 0
                },
                {
                    duration: 1,
                    ease: 'expo.out',
                    yPercent: 0,
                    opacity: 1,
                    stagger: 0.02
                }
            );
        });
    }
</script>
