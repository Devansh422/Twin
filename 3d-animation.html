<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>

		@font-face {
  font-family: 'base';
  src: url('./font/VastagoGrotesk-Regular.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'heading';
  src: url('./font/VastagoGrotesk-SemiBold.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

		
*{
	margin: 0;
	padding: 0;
	box-sizing: border-box;    
}
:root{
	--color:#ED1D21;
	--padding: 1rem;
}

body{
	position: relative;
	height: fit-content;
	width:100%;
	display: flex;
	flex-direction: column;
	justify-content: center;
	font-family: "base";
	overflow-x: hidden;
  max-width: 2000px;
}
	</style>
</head>
<body>
<div class="main-display-area" style="position: relative;">
   <div id="animation-container-main" style="position: relative; z-index: 2;"></div>
</div>





<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

<script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
            }
        }
    </script>

<!-- GSAP Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>


<script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // --- 1. Inject CSS ---
        const injectedStyles = `
            body {
                overflow-x: hidden;
            }
            #animation-container-main {
                position: relative;
                width: 100%;
                display: block;
                z-index: 2;
                margin-top: 0;
            }
            .scrollable-sections {
                position: relative;
                z-index: 0;
                width: 100%;
                height: 1000vh;
            }
            .left-content-side {
                position: fixed;
                top: 0;
                left: 0;
                width: 50%;
                height: 100vh;
                background-color: #dc2626;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: none;
            }
            .right-canvas-side {
                position: fixed;
                top: 0;
                left: 50%;
                width: 50%;
                height: 100vh;
                z-index: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #f5f5f5;
                pointer-events: none;
            }
            #threejs-viewport {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
                pointer-events: none;
            }
            .content-panel {
                position: fixed;
                top: 0;
                left: 0;
                width: 50%;
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                font-size: 4rem;
                pointer-events: none;
                padding: 0 8vw;
                box-sizing: border-box;
                text-align: left;
                overflow-wrap: break-word;
                color: white;
                z-index: 3;
                opacity: 0;
            }

            .content-panel h1 {font-family:"Heading"; margin: 0; font-weight: 800; letter-spacing: -2px; color: white; font-size:4rem; line-height: 1.1;}
            .content-panel p { font-family:"base"; font-size: 1.5rem; opacity: 0.9; font-weight: 300; margin-top: 20px; color: white; }
            .primary-label { color: white; font-family:"Heading"; }
            .secondary-label { color: white; font-family:"Heading"; }
            .content-panel.active { opacity: 1; }
            
            @media (max-width: 1024px) {
                #animation-container-main {
                    flex-direction: column;
                }
                .left-content-side {
                    width: 100%;
                }
                .right-canvas-side {
                    position: fixed;
                    width: 100%;
                    height: 50vh;
                    left: 0;
                    bottom: 0;
                    top: auto;
                }
                .content-panel {
                    min-height: 50vh;
                    height: 100vh;
                }
            }
        `;
        const dynamicStyleElement = document.createElement("style");
        dynamicStyleElement.innerText = injectedStyles;
        document.head.appendChild(dynamicStyleElement);

        // --- 2. Generate HTML Structure ---
        let mainContainer = document.getElementById('animation-container-main');
        if (!mainContainer) {
            mainContainer = document.createElement('div');
            mainContainer.id = 'animation-container-main';
            document.body.prepend(mainContainer);
        }
        
        mainContainer.innerHTML = `
            <div class="scrollable-sections">
                <div class="content-panel">
                    <h1>Discover Excellence</h1>
                    <p>Scroll to explore our journey</p>
                </div>
                <div class="content-panel">
                    <h1 class="animate-text">SPRAYZET</h1>
                    <p class="animate-text">Industrial MRO<span class="primary-label"> Aerosols</span></p>
                </div>
                <div class="content-panel">
                    <h1>Engineered to Perform.</h1>
                    <p>Built to Endure.</p>
                </div>
                <div class="content-panel">
                    <h1>The Transformation</h1>
                    <p>Watch the shift</p>
                </div>
                <div class="content-panel">
                    <h1>EVERSHINE</h1>
                    <p>Car Care <span class="secondary-label">Products</span></p>
                </div>
                <div class="content-panel">
                    <h1>Shine That You</h1>
                    <p>Can Feel.</p>
                </div>
                <div class="content-panel">
                    <h1>Next Chapter</h1>
                    <p>Unveiling strength</p>
                </div>
                <div class="content-panel">
                    <h1>TWIN TAPE</h1>
                    <p>Industrial <span class="primary-label">Adhesive Solutions</span></p>
                </div>
                <div class="content-panel">
                    <h1>Bonds That Last.</h1>
                    <p>Trust That Holds.</p>
                </div>
                <div class="content-panel">
                    <h1>Three Brands.</h1>
                    <p>One Vision of Excellence.</p>
                </div>
            </div>
            <div class="left-content-side"></div>
            <div class="right-canvas-side">
                <canvas id="threejs-viewport"></canvas>
            </div>
        `;

        // --- 3. Initialize 3D & Animation ---
        gsap.registerPlugin(ScrollTrigger);

        const renderCanvas = document.querySelector('#threejs-viewport');
        
        // --- Scene Setup ---
        const threeScene = new THREE.Scene();
        
        const perspectiveCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        perspectiveCamera.position.set(0, 0, 5);

        const webglRenderer = new THREE.WebGLRenderer({ 
            canvas: renderCanvas,
            antialias: true, 
            alpha: true 
        });
        webglRenderer.setSize(window.innerWidth, window.innerHeight);
        webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        webglRenderer.shadowMap.enabled = true;
        webglRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
        webglRenderer.toneMapping = THREE.ACESFilmicToneMapping;
        webglRenderer.toneMappingExposure = 1.2;

        // --- HDR Environment Lighting ---
        const rgbeLoader = new RGBELoader();
        rgbeLoader.load('./assets/neutral.hdr', function(texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            threeScene.environment = texture;
            threeScene.background = null; // Keep background transparent, only use HDR for lighting
        });

        // --- Model Loading ---
        const gltfModelLoader = new GLTFLoader();
        let firstModel, secondModel, tapeModel;
        const objectGroup = new THREE.Group();
        threeScene.add(objectGroup);

        const loadGltfAsset = (assetPath) => {
            return new Promise((resolve, reject) => {
                gltfModelLoader.load(assetPath, (gltfData) => {
                    const loadedModel = gltfData.scene;
                    loadedModel.traverse((meshNode) => {
                        if (meshNode.isMesh) {
                            meshNode.castShadow = true;
                            meshNode.receiveShadow = true;
                            if(meshNode.material) {
                                meshNode.material.envMapIntensity = 1.0;
                                meshNode.material.roughness = 0.3;
                                meshNode.material.metalness = 0.3;
                            }
                        }
                    });
                    const boundingBox = new THREE.Box3().setFromObject(loadedModel);
                    const dimensions = boundingBox.getSize(new THREE.Vector3());
                    const largestDimension = Math.max(dimensions.x, dimensions.y, dimensions.z);
                    const normalizedScale = 2.5 / largestDimension; 
                    loadedModel.scale.set(normalizedScale, normalizedScale, normalizedScale);
                    const centerPoint = boundingBox.getCenter(new THREE.Vector3());
                    loadedModel.position.sub(centerPoint.multiplyScalar(normalizedScale));
                    resolve(loadedModel);
                }, undefined, reject);
            });
        };

        // If running from file:// protocol the browser will often block GLTF asset loads
        // due to CORS. In that case, create fallback geometry immediately to avoid errors.
        const isFileProtocol = window.location.protocol === 'file:';
        if (isFileProtocol) {
            firstModel = generateFallbackGeometry(0xff3333);
            secondModel = generateFallbackGeometry(0x3388ff);
            tapeModel = generateFallbackTape(0x996633);

            objectGroup.add(firstModel);
            objectGroup.add(secondModel);
            threeScene.add(tapeModel);

            secondModel.visible = false;
            secondModel.rotation.copy(firstModel.rotation);

            // Initial State: Hidden below
            objectGroup.position.y = -10;
            objectGroup.rotation.y = Math.PI;

            // tape initial off-screen left
            tapeModel.position.set(-6, -1.5, 0);
            tapeModel.rotation.z = 0;

            initializeScrollAnimation();
        } else {
            Promise.all([
                loadGltfAsset('./assets/Black_Can.glb').catch(() => generateFallbackGeometry(0xff3333)),
                loadGltfAsset('./assets/Red_Can.glb').catch(() => generateFallbackGeometry(0x3388ff)),
                loadGltfAsset('./assets/Brown_Tape.glb').catch(() => generateFallbackTape(0x996633))
            ]).then(([primaryAsset, secondaryAsset, loadedTape]) => {
                firstModel = primaryAsset;
                secondModel = secondaryAsset;
                tapeModel = loadedTape;

                objectGroup.add(firstModel);
                objectGroup.add(secondModel);
                threeScene.add(tapeModel);

                secondModel.visible = false;
                secondModel.rotation.copy(firstModel.rotation);

                // Initial State: Hidden below
                objectGroup.position.y = -10; 
                objectGroup.rotation.y = Math.PI;

                // tape initial off-screen left
                tapeModel.position.set(-6, -1.5, 0);
                tapeModel.rotation.z = 0;

                initializeScrollAnimation();
            });
        }

        function generateFallbackGeometry(colorHex) {
            const cylinderGeometry = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 32);
            const standardMaterial = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.2, roughness: 0.3 });
            const fallbackMesh = new THREE.Mesh(cylinderGeometry, standardMaterial);
            return fallbackMesh;
        }

        function generateFallbackTape(colorHex) {
            // a flattened cylinder to simulate a tape roll
            const geo = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 32);
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.15, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2; // lie it on its side
            return mesh;
        }

        // --- Animation Logic ---
        function initializeScrollAnimation() {
            const panels = document.querySelectorAll('.content-panel');
            const totalSections = panels.length;
            
            // Show first panel initially
            gsap.set(panels[0], { opacity: 1 });
            
            // Create scroll-driven text transitions and 3D animation chunks
            panels.forEach((panel, index) => {
                const start = index * 100; // Each section starts at index * 100vh
                const end = (index + 1) * 100; // And ends at next section
                
                // Text reveal animation for each section
                ScrollTrigger.create({
                    trigger: '.scrollable-sections',
                    start: `${start}vh top`,
                    end: `${end}vh top`,
                    scrub: true,
                    onUpdate: (self) => {
                        const progress = self.progress;
                        
                        // Current panel fades out as we scroll through it
                        gsap.to(panel, { opacity: 1 - progress, duration: 0.1 });
                        
                        // Next panel fades in
                        if (index < totalSections - 1) {
                            gsap.to(panels[index + 1], { opacity: progress, duration: 0.1 });
                        }
                    }
                });
                
                // 3D Animation chunk for each section
                if (index === 0) {
                    // Section 0: Initial Reveal
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '0vh top',
                        end: '100vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(objectGroup.position, { y: -10 + (10 * progress), duration: 0.1 });
                            gsap.to(objectGroup.rotation, { y: Math.PI - (Math.PI * progress), z: 0.1 * progress, duration: 0.1 });
                        }
                    });
                } else if (index === 1) {
                    // Section 1: Intro & Tilt
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '100vh top',
                        end: '200vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(objectGroup.rotation, { 
                                y: Math.PI * 2.2 * progress, 
                                x: -0.2 * progress, 
                                z: 0, 
                                duration: 0.1 
                            });
                        }
                    });
                } else if (index === 2) {
                    // Section 2: Cinematic Move
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '200vh top',
                        end: '300vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(perspectiveCamera.position, { z: 5 - (2 * progress), y: 0.2 * progress, duration: 0.1 });
                            gsap.to(objectGroup.rotation, { 
                                z: -0.3 * progress, 
                                y: Math.PI * 2.2 + (Math.PI * 1.8 * progress), 
                                duration: 0.1 
                            });
                        }
                    });
                } else if (index === 3) {
                    // Section 3: Transition & Spin
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '300vh top',
                        end: '400vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            const spinProgress = progress;
                            gsap.to(objectGroup.rotation, { y: Math.PI * 4 + (Math.PI * 4 * spinProgress), duration: 0.1 });
                            
                            if (spinProgress > 0.5 && firstModel.visible) {
                                firstModel.visible = false;
                                secondModel.visible = true;
                            } else if (spinProgress < 0.5 && !firstModel.visible) {
                                firstModel.visible = true;
                                secondModel.visible = false;
                            }
                            
                            const shake = Math.sin(spinProgress * Math.PI) * 2.5;
                            gsap.to(perspectiveCamera.position, { z: 3 + shake, duration: 0.1 });
                        }
                    });
                } else if (index === 4) {
                    // Section 4: Settle
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '400vh top',
                        end: '500vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(objectGroup.rotation, { 
                                y: Math.PI * 8 + (Math.PI * 2 * progress), 
                                x: 0, 
                                z: 0, 
                                duration: 0.1 
                            });
                            gsap.to(perspectiveCamera.position, { z: 5.5 - (1.5 * progress), y: 0, duration: 0.1 });
                        }
                    });
                } else if (index === 5) {
                    // Section 5: Showcase
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '500vh top',
                        end: '600vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(objectGroup.rotation, { y: Math.PI * 10 + (Math.PI * 2 * progress), duration: 0.1 });
                        }
                    });
                } else if (index === 6) {
                    // Section 6: Move right
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '600vh top',
                        end: '700vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(objectGroup.position, { x: 2 * progress, duration: 0.1 });
                            gsap.to(objectGroup.rotation, { y: Math.PI * 12 + (Math.PI * 3 * progress), duration: 0.1 });
                        }
                    });
                } else if (index === 7) {
                    // Section 7: Can exits, Tape enters
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '700vh top',
                        end: '800vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            gsap.to(objectGroup.position, { x: 2 + (18 * progress), duration: 0.1 });
                            gsap.to(objectGroup.rotation, { y: Math.PI * 15 + (Math.PI * 3 * progress), duration: 0.1 });
                            
                            if (tapeModel) {
                                gsap.to(tapeModel.position, { x: -8 + (8 * progress), y: -0.5 * progress, z: -4 * progress, duration: 0.1 });
                                gsap.to(tapeModel.rotation, { y: Math.PI * 3.8 * progress, x: 0.5 * progress, duration: 0.1 });
                            }
                        }
                    });
                } else if (index === 8) {
                    // Section 8: Tape zoom
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '800vh top',
                        end: '900vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            if (tapeModel) {
                                if (progress < 0.5) {
                                    const zoomProgress = progress * 2;
                                    gsap.to(tapeModel.position, { z: -4 + (4 * zoomProgress), duration: 0.1 });
                                    gsap.to(tapeModel.rotation, { y: Math.PI * 3.8 + (Math.PI * 1.4 * zoomProgress), duration: 0.1 });
                                } else {
                                    const zoomOutProgress = (progress - 0.5) * 2;
                                    gsap.to(tapeModel.position, { z: 0 - (4 * zoomOutProgress), duration: 0.1 });
                                    gsap.to(tapeModel.rotation, { y: Math.PI * 5.2 + (Math.PI * 1.8 * zoomOutProgress), duration: 0.1 });
                                }
                            }
                        }
                    });
                } else if (index === 9) {
                    // Section 9: Tape exits
                    ScrollTrigger.create({
                        trigger: '.scrollable-sections',
                        start: '900vh top',
                        end: '1000vh top',
                        scrub: 1,
                        onUpdate: (self) => {
                            const progress = self.progress;
                            if (tapeModel) {
                                gsap.to(tapeModel.position, { x: 10 * progress, y: 2 * progress, z: -4, duration: 0.1 });
                                gsap.to(tapeModel.rotation, { y: Math.PI * 7 + (Math.PI * progress), duration: 0.1 });
                            }
                        }
                    });
                }
            });
        }

        // --- Resize ---
        window.addEventListener('resize', () => {
            perspectiveCamera.aspect = window.innerWidth / window.innerHeight;
            perspectiveCamera.updateProjectionMatrix();
            webglRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Loop ---
        function renderLoop() {
            requestAnimationFrame(renderLoop);
            webglRenderer.render(threeScene, perspectiveCamera);
        }
        renderLoop();
    </script>




<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

<script>
    gsap.registerPlugin(ScrollTrigger);

    // Initialize Lenis Smooth Scroll
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      direction: "vertical",
      gestureDirection: "vertical",
      smooth: true,
      mouseMultiplier: 1,
      smoothTouch: false,
      touchMultiplier: 2,
      infinite: false,
      prevent: (node) => node.closest('.main-display-area')
    });

    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);
</script>

</body>
</html>
